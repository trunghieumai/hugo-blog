<div class="footer__languages">
    {{ if gt (len .Site.Languages) 1 }} {{ range .Site.Languages }} {{ if eq
    .LanguageName $.Site.Language.LanguageName }}
    <strong>{{ .LanguageName }}</strong>
    {{ else }}
    <a href="{{ . | absURL }}" data-rel="prefetch">{{ .LanguageName }}</a>
    {{ end }} {{ end }} {{ end }}
</div>
